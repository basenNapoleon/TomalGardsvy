<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tomal gårdsvy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: scenen fyller hela skärmen; klocka och knappar ligger ovanpå, inställningarna glider in från höger. */
:root{
  --bg:#e9edf0; --panel:#ffffff; --fg:#17222b; --muted:#5a6a77; --line:#d3dae0; --chip:#e4e9ed;
  --accent:#d95a0b; --accent-fg:#ffffff;
  --glass:rgba(16,23,29,.8); --glass-fg:#ffffff; --glass-muted:rgba(255,255,255,.68); --hi:#ff8a3c;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f161c; --panel:#18222b; --fg:#e6edf2; --muted:#93a3b0; --line:#2a3742; --chip:#223039;
  --accent:#ff8a3c; --accent-fg:#1c0f04; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#18222b; --fg:#e6edf2; --muted:#93a3b0; --line:#2a3742; --chip:#223039;
  --accent:#ff8a3c; --accent-fg:#1c0f04; color-scheme:dark }
html,body{height:100%;margin:0}
body{background:#8f7b62;color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;overflow:hidden}
[hidden]{display:none!important}
.app{position:relative;height:100%}
.stage{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.app.idle,.app.idle *{cursor:none!important}
.top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.chip{background:var(--glass);color:var(--glass-fg);border-radius:4px;padding:8px 12px}
.brand{display:flex;align-items:center;gap:10px}
h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;margin:0;text-transform:uppercase;line-height:1}
.sim{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--glass-muted)}
.clockbox{display:flex;align-items:baseline;gap:10px}
.clock{font-family:var(--display);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.phase{color:var(--glass-muted);font-size:13px}
.tools{margin-left:auto;display:flex;gap:6px}
.tools button,.zoom button{background:var(--glass);color:var(--glass-fg);border:1px solid transparent}
.tools button:hover,.zoom button:hover{border-color:var(--hi)}
.zoom{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.zoom button{width:36px;height:36px;padding:0;font-size:18px;font-weight:600}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#info{position:absolute;left:12px;bottom:calc(60px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 24px));background:var(--glass);color:var(--glass-fg);border-left:3px solid var(--hi);border-radius:4px;padding:12px 14px}
#info h3{font-family:var(--display);font-size:22px;font-weight:600;margin:0 0 6px;line-height:1.1}
#info p{margin:0 0 6px;font-size:15px;line-height:1.45}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
#info dt{color:var(--glass-muted)}#info dd{margin:0}
aside{position:absolute;top:0;right:0;bottom:0;width:min(340px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
.phead{display:flex;align-items:center;justify-content:space-between}
.phead h2{margin:0}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:6px 0;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin-top:10px}
.row label{font-weight:500}.row output{font-variant-numeric:tabular-nums;font-weight:600}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px}
.send{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.kpi b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#log li{display:grid;grid-template-columns:3.2em 1fr;gap:6px}
#log time{color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:600px){.phase{display:none}.clock{font-size:22px}h1{font-size:18px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="yard" aria-label="Isometrisk vy över gården med truckar, lastbilar och silotransporter"></canvas>
    <div class="top">
      <div class="chip brand"><h1>Tomal gårdsvy</h1><span class="sim">Simulerad data</span></div>
      <div class="chip clockbox"><span class="clock" id="clock">07:25</span><span class="phase" id="phase"></span></div>
      <div class="tools"><button id="bFull">Helskärm</button><button id="bSet" aria-expanded="false" aria-controls="panel">Inställningar</button></div>
    </div>
    <div id="info" hidden></div>
    <div class="zoom"><button id="zin" aria-label="Zooma in">+</button><button id="zout" aria-label="Zooma ut">−</button><button id="zfit" aria-label="Återställ vy" style="width:auto;padding:0 10px;font-size:13px">Hela gården</button></div>
  </div>
  <aside id="panel" hidden>
    <div class="phead"><h2>Inställningar</h2><button id="bClose">Stäng</button></div>
    <section>
      <h2>Uppspelning</h2>
      <div class="seg" id="speed">
        <button data-s="0" aria-pressed="false">Paus</button><button data-s="1" aria-pressed="true">1×</button><button data-s="2" aria-pressed="false">2×</button><button data-s="4" aria-pressed="false">4×</button><button data-s="8" aria-pressed="false">8×</button>
      </div>
      <div class="row"><label for="tod">Tid på dygnet</label><output id="todO">07:25</output><input id="tod" type="range" min="0" max="1435" step="5" value="445"></div>
      <div class="row"><label for="nFork">Truckar</label><output id="nForkO">2</output><input id="nFork" type="range" min="1" max="2" value="2"></div>
      <div class="row"><label for="nVan">Paketbilar per dag</label><output id="nVanO">9</output><input id="nVan" type="range" min="0" max="24" value="9"></div>
      <div class="row"><label for="nOut">Kundlastbilar per dag</label><output id="nOutO">3</output><input id="nOut" type="range" min="0" max="8" value="3"></div>
      <div class="row"><label for="nSilo">Silotransporter per dag</label><output id="nSiloO">1</output><input id="nSilo" type="range" min="0" max="3" value="1"></div>
    </section>
    <section>
      <h2>Visning</h2>
      <label class="chk"><input id="labels" type="checkbox" checked> Visa skyltar</label>
      <label class="chk"><input id="tour" type="checkbox"> Visa byggnaderna en i taget</label>
    </section>
    <section>
      <h2>Skicka in nu</h2>
      <div class="send"><button id="bVan">Paketbil</button><button id="bPlat">Plåtleverans</button><button id="bOut">Kundlastbil</button><button id="bSiloIn">Silo in</button><button id="bSiloOut">Silo ut</button><button id="bMove">Maskin till pack</button></div>
    </section>
    <section>
      <h2>I dag</h2>
      <div class="kpi">
        <div><b id="kInn">0</b><span>kolli mottagna</span></div><div><b id="kPack">0</b><span>maskiner till pack</span></div><div><b id="kOut">0</b><span>utlevererade</span></div>
        <div><b id="kSilo">0</b><span>silos i silohallen</span></div><div><b id="kCars">0</b><span>bilar parkerade</span></div><div><b id="kJobs">0</b><span>truckjobb i kö</span></div>
      </div>
    </section>
    <section><h2>Händelser</h2><ul id="log"></ul></section>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>

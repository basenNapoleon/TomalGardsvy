<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tomal gårdsvy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: en skärm – isometrisk gård till vänster, smal manöverpanel till höger (staplas under på mobil). */
:root{
  --bg:#e9edf0; --panel:#ffffff; --fg:#17222b; --muted:#5a6a77; --line:#d3dae0; --chip:#e4e9ed;
  --accent:#d95a0b; --accent-fg:#ffffff; --ok:#1d7f4f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f161c; --panel:#18222b; --fg:#e6edf2; --muted:#93a3b0; --line:#2a3742; --chip:#223039;
  --accent:#ff8a3c; --accent-fg:#1c0f04; --ok:#5fd39a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#18222b; --fg:#e6edf2; --muted:#93a3b0; --line:#2a3742; --chip:#223039;
  --accent:#ff8a3c; --accent-fg:#1c0f04; --ok:#5fd39a; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.sim{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);color:var(--muted);padding:3px 8px;border-radius:3px}
.clock{margin-left:auto;font-family:var(--display);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.phase{color:var(--muted);font-size:13px;min-width:9em}
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
.stage{position:relative;min-height:0;min-width:0;background:#8f7b62}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
.hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:#fff;background:rgba(15,22,28,.55);padding:3px 8px;border-radius:3px}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.zoom button{width:36px;height:36px;padding:0;font-size:18px;font-weight:600}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding:14px 16px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:6px 0;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin-top:10px}
.row label{font-weight:500}.row output{font-variant-numeric:tabular-nums;font-weight:600}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.send{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.kpi b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
#info{border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 12px;min-height:74px}
#info h3{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 4px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
#info dt{color:var(--muted)}#info dd{margin:0}#info p{margin:0;color:var(--muted)}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#log li{display:grid;grid-template-columns:3.2em 1fr;gap:6px}
#log time{color:var(--muted);font-variant-numeric:tabular-nums}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px}
@media (max-width:820px){
  html,body{height:auto}.app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}.stage{height:60svh}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .clock{font-size:24px}.phase{display:none}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Tomal gårdsvy</h1><span class="sim">Simulerad data</span>
  <span class="clock" id="clock">07:25</span><span class="phase" id="phase"></span>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="yard" aria-label="Isometrisk vy över gården med truckar, lastbilar och silotransporter"></canvas>
    <div class="zoom"><button id="zin" aria-label="Zooma in">+</button><button id="zout" aria-label="Zooma ut">−</button><button id="zfit" aria-label="Återställ vy" style="width:auto;padding:0 10px;font-size:13px">Hela gården</button></div>
    <div class="hint">Dra för att flytta · klicka för info</div>
  </div>
  <aside>
    <section>
      <h2>Uppspelning</h2>
      <div class="seg" id="speed">
        <button data-s="0" aria-pressed="false">Paus</button><button data-s="1" aria-pressed="true">1×</button><button data-s="2" aria-pressed="false">2×</button><button data-s="4" aria-pressed="false">4×</button><button data-s="8" aria-pressed="false">8×</button>
      </div>
      <div class="row"><label for="tod">Tid på dygnet</label><output id="todO">07:25</output><input id="tod" type="range" min="0" max="1435" step="5" value="445"></div>
      <div class="row"><label for="nFork">Truckar</label><output id="nForkO">3</output><input id="nFork" type="range" min="1" max="4" value="3"></div>
      <div class="row"><label for="nVan">Paketbilar per dag</label><output id="nVanO">9</output><input id="nVan" type="range" min="0" max="24" value="9"></div>
      <div class="row"><label for="nOut">Kundlastbilar per dag</label><output id="nOutO">3</output><input id="nOut" type="range" min="0" max="8" value="3"></div>
      <div class="row"><label for="nSilo">Silotransporter per dag</label><output id="nSiloO">1</output><input id="nSilo" type="range" min="0" max="3" value="1"></div>
      <label class="chk"><input id="labels" type="checkbox" checked> Visa skyltar</label>
    </section>
    <section>
      <h2>Skicka in nu</h2>
      <div class="send"><button id="bVan">Paketbil</button><button id="bPlat">Plåtleverans</button><button id="bOut">Kundlastbil</button><button id="bSiloIn">Silo in</button><button id="bSiloOut">Silo ut</button><button id="bMove">Maskin till pack</button></div>
    </section>
    <section>
      <h2>I dag</h2>
      <div class="kpi">
        <div><b id="kInn">0</b><span>kolli mottagna</span></div><div><b id="kPack">0</b><span>maskiner till pack</span></div><div><b id="kOut">0</b><span>utlevererade</span></div>
        <div><b id="kSilo">0</b><span>silos i silohallen</span></div><div><b id="kCars">0</b><span>bilar parkerade</span></div><div><b id="kJobs">0</b><span>truckjobb i kö</span></div>
      </div>
    </section>
    <section><h2>Valt objekt</h2><div id="info"><p>Klicka på en truck, lastbil eller byggnad.</p></div></section>
    <section><h2>Händelser</h2><ul id="log"></ul></section>
  </aside>
</main>
</div>
<script src="app.js"></script>

</body>
</html>
